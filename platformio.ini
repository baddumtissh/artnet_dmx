; platformio.ini — ArtNet/sACN → DMX Decoder
; v1.4.0
; Board: generic ESP32 (ESP32-D0WD-V3, 4MB flash) + SP3485/MAX485 on UART2

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

board_upload.flash_size = 4MB

lib_deps =
  esp32async/ESPAsyncWebServer @ ^3.11.2
  esp32async/AsyncTCP @ ^3.4.10
  ArduinoOTA

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
